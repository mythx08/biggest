name: CI Pipeline - Build, Scan and Publish

on:
  push:
    branches:
      - main
    paths:
      - 'application/**'
      - '.github/workflows/ci.yaml'
  pull_request:
    branches:
      - main
    paths:
      - 'application/**'

jobs:
  backend-ci:
    name: Backend CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: application/backend/package.json

      - name: Install dependencies & Run tests
        run: |
          cd application/backend
          npm install
          npm test

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Image
        run: |
          docker build -t mythx08/backend-api:${{ github.sha }} ./application/backend

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: mythx08/backend-api:${{ github.sha }}
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL'

      - name: Log in to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag and Push Image to Docker Hub
        if: github.event_name == 'push'
        run: |
          docker tag mythx08/backend-api:${{ github.sha }} mythx08/backend-api:1.0.1
          docker tag mythx08/backend-api:${{ github.sha }} mythx08/backend-api:latest
          docker push mythx08/backend-api:${{ github.sha }}
          docker push mythx08/backend-api:1.0.1
          docker push mythx08/backend-api:latest

  frontend-ci:
    name: Frontend CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Frontend Image
        run: |
          docker build -t mythx08/frontend-ui:${{ github.sha }} ./application/frontend

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: mythx08/frontend-ui:${{ github.sha }}
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL'

      - name: Log in to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag and Push Image to Docker Hub
        if: github.event_name == 'push'
        run: |
          docker tag mythx08/frontend-ui:${{ github.sha }} mythx08/frontend-ui:1.0.1
          docker tag mythx08/frontend-ui:${{ github.sha }} mythx08/frontend-ui:latest
          docker push mythx08/frontend-ui:${{ github.sha }}
          docker push mythx08/frontend-ui:1.0.1
          docker push mythx08/frontend-ui:latest